# Synthetic staircases for the 1:1 build of Maps/archive/dp.bt (0.1 m raw octree; scenes/dp_bt -> scenes/dp_bt_s16).
# scripts/make_stairs.py runs in exact-box mode on this scene (no ground.npz): every tread / landing becomes one AABB.
#
# Same map frame as Maps/dp.pcd / scenes/dp. Footprints and heights were read off vertical slices of the octree (per
# 0.1 m y the set of occupied cell tops), cross-sections across each flight and `make_stairs.py --map` voxel maps of
# scenes/dp_bt; all edges sit on the 0.1 m cell grid. This octree is a raw scan: floors carry +-0.1 m noise, landings
# have holes, and the 2F slab is 5.3 south of E2 but 5.1 south of W4, so the z values follow the local floor at each
# junction. Footprints stop short of the handrails, the newel posts and the half-height divider walls between the
# west flights (x -10.0..-9.7 on L1/L3, x -9.9..-9.6 on L2) so those survive the clearing intact.
riser: 0.16            # target; each flight uses n = round(rise / riser) steps of rise / n
thickness: 0.30        # solid depth below each tread top (> riser: the risers are solid, the soffit is stepped)
clear: [0.35, 1.0]     # original voxels in [h - 0.35, h + 1.0] of the target height are removed inside the footprint

stairs:
  - name: east                                    # two straight flights with a landing, 1F -0.2 -> EL 2.3 -> 2F 5.3
    flights:
      # E1: treads x 5.7-7.0 (west handrail x 5.5-5.7, a gap and the wall from x 7.0); first riser at y -11.8
      - {name: E1, start: [6.35, -11.80], end: [6.35, -7.60],  width: 1.3, z0: -0.2, z1: 2.3}   # north, 16 x 0.156
      # E2: treads x 3.9-5.1 (rails x 3.6-3.8 and 5.1+, a rail post at x 3.8 by the head); 2F at the head is scanned
      # 5.0-5.1 up to y -12.7 and 5.2-5.3 beyond
      - {name: E2, start: [4.50, -7.70],  end: [4.50, -12.50], width: 1.2, z0: 2.3,  z1: 5.3}   # south, 19 x 0.158
    landings:
      - {name: EL,  rect: [3.5, 6.9, -7.60, -6.10],   z: 2.3}    # the scan drops to 2.0 in the middle (x 4.4-6.0)
      - {name: E0,  rect: [5.7, 7.0, -13.30, -11.80], z: -0.2}   # approach pad at the foot (1F scanned -0.3 / -0.2)
      - {name: E2T, rect: [3.9, 5.1, -12.90, -12.50], z: 5.3}    # approach pad at the head (2F scanned 5.0-5.1 here)

  - name: west                                    # switchback stairwell, 1F -0.2 -> 1.2 -> 2.5 -> 3.8 -> 2F 5.1
    flights:
      - {name: W1, start: [-10.75, -12.20], end: [-10.75, -10.30], width: 1.5, z0: -0.2, z1: 1.2}   # north, 9 x 0.156
      - {name: W2, start: [-9.10,  -10.30], end: [-9.10,  -12.50], width: 1.2, z0: 1.2,  z1: 2.5}   # south, 8 x 0.1625
      - {name: W3, start: [-10.55, -12.40], end: [-10.55, -10.40], width: 1.1, z0: 2.5,  z1: 3.8}   # north, 8 x 0.1625
      - {name: W4, start: [-9.00,  -10.30], end: [-9.00,  -12.40], width: 1.0, z0: 3.8,  z1: 5.1}   # south, 8 x 0.1625
    landings:
      # L1 (1.2): scanned with holes (x -10.9..-10.0 missing, a 0.9 strip at x -9.8..-9.3); divider post x -10.0..-9.7
      - {name: L1a, rect: [-11.5, -10.0, -10.30, -9.20], z: 1.2}
      - {name: L1b, rect: [-9.7,  -8.6,  -10.30, -9.20], z: 1.2}
      - {name: L1c, rect: [-10.0, -9.7,  -9.90,  -9.20], z: 1.2}
      # L2: scanned 2.4 on the east half, 2.6 on the west half -> one flat 2.5; the divider wall x -9.9..-9.6 runs to
      # y -12.9, the west wall jogs from x -11.5 (south part) to x -11.2 (under W3)
      - {name: L2a, rect: [-11.4, -9.9, -13.40, -12.90], z: 2.5}
      - {name: L2b, rect: [-11.1, -9.9, -12.90, -12.50], z: 2.5}
      - {name: L2c, rect: [-9.6,  -8.3, -13.40, -12.50], z: 2.5}
      - {name: L2d, rect: [-9.9,  -9.6, -13.40, -12.90], z: 2.5}
      # L3 (3.8): divider post x -10.0..-9.7 down to y -10.1
      - {name: L3a, rect: [-11.3, -10.0, -10.40, -9.30], z: 3.8}
      - {name: L3b, rect: [-9.7,  -8.5,  -10.40, -9.30], z: 3.8}
      - {name: L3c, rect: [-10.0, -9.7,  -10.10, -9.30], z: 3.8}
      - {name: W4T, rect: [-9.5,  -8.5,  -12.90, -12.40], z: 5.1}   # approach pad at W4's head (2F scanned 4.9-5.1)
