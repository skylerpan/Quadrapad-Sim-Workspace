# Quadruped navigation sim (MuJoCo, ideal base). All units SI unless noted.
scene: scenes/dp                 # directory produced by pcd2sim.build_scene. scenes/dp: Maps/dp.bt, 0.2 m, the frame of the robot01 nav stack's localization map (maps/dp/dp.pcd = Maps/dp_full_original.pcd; robot01.ini 2026-10-22), so the sim and the nav stack agree. scenes/dp_1008 (Maps/dp_1008.pcd, 0.1 m, --no-flatten --close-rounds 1, the robot-layer runs of 2026-10-29) is a different frame: localization never converges on it. scenes/dp_1012 = 1:1 build of the hand-edited octree (docs/usage.md section 2)
spawn: [0.0, 0.0, 0.0, -0.4]  # [x, y, yaw, z_floor]; null = meta.json spawn, yaw 0. z_floor = floor height of that storey (dp 1F at (0,0): -0.40; dp_1008: -0.45; dp_1012: -0.40)

physics:
  timestep: 0.001             # s (1 kHz: the G23 controller expects 1 kHz telemetry; IMU/clock 200 Hz and control 50 Hz divide evenly)
  control_hz: 50              # ideal-base update + collision proxy refresh
  rtf: 1.0                    # real-time factor; 0 = run as fast as possible

robot:
  type: g23                   # g23: the G23 legged model driven by its controller over UDP (robot.controller.kind)
                              # tests / eval_scene / bench pin robot.type=ideal; robot.controller.spawn: false keeps sim_node
                              # from starting the controller (run it yourself)
                              # ideal: floating base that follows /cmd_vel and hugs the terrain (no legs, no controller)
  behavior: rl_fcn            # g23 motorcontrol: the behavior requested after standing: rl_fcn (PPO flat-terrain walk),
                              # rl_him (HIMLoco stairs / rough terrain), gait_mpc. An Int32 on ros.topics.policy_mode switches
                              # live (0 -> rl_fcn, 1 -> rl_him; other slots are refused), by way of stand
  gait: rl                    # g23 g2_deploy_rs only: locomotion mode sent after standing, rl (ONNX policy) or lma (OCS2 NMPC + WBC)
  policy_mode: 0              # g23 g2_deploy_rs only: RL policy at start, 0 = PPO flat-terrain walk, 1 = HIMLoco stairs / rough
                              # terrain, 4 = IsaacSim; ros.topics.policy_mode switches live as MODE <n>. PPO trips its posture
                              # guard on 0.1 m bumps the floor fixes remove
  fall_height: 0.18           # g23: torso lower than this over the floor for 1 s while walking = `fall` (collapsed)
  motor_model: null           # g23: null = follow G2_SIM_MOTOR_MODEL like the controller's own sim (j60 default: armature /
                              # dry friction / damping on the 12 joints + torque envelope); j60 | ideal here overrides it
  level_gravity: true         # g23: gravity straight down (the controller's sim); false = along the scene's fitted floor normal
  auto_stand: true            # g23: stand start_delay s after spawn / set_pose, the gait / behavior stand_delay s later
  start_delay: 1.0
  stand_delay: 4.0            # >= 3 s: MotorControl's rise_to_stand takes 3 s and refuses an RL behavior before it settled
  spawn_height: 0.40          # g23: torso centre above the floor at spawn (it settles to ~0.36 standing)
  controller:                 # g23: which controller sim_node spawns and how quadsim talks to it (quadsim/controller_proc.py)
    kind: motorcontrol        # motorcontrol: SyncAI-Device-MotorControl (robotdog_control, the default; quadsim/motorcontrol.py)
                              # g2_deploy_rs: the original controller (g2_deploy_rs sim ros; quadsim/g23.py)
    spawn: true               # false: do not start the controller, run it yourself (or python3 -m tests.fake_motorcontrol)
    # exec: ...               # the binary (default <repo>/target/release/<controller>), args: [...], env: {KEY: value}
    motorcontrol:             # the controller's sim backend UDP ports (its ROBOTDOG_SIM_* / ROBOTDOG_OPERATOR_UDP_PORT defaults)
      cmd_port: 40001         # torque commands from the controller (240 bytes: pos, vel, tau, kp, kd per motor x 12)
      joint_addr: 127.0.0.1:40002     # joint feedback to the controller, every physics step (144 bytes: q, dq, tau x 12)
      base_addr: 127.0.0.1:40003      # base state to the controller, every physics step (36 bytes: rpy, gyro, acc)
      operator_addr: 127.0.0.1:40020  # operator lines (stand / rl_fcn / vel x y w / reset ...); status comes back on the same socket
    # g2_deploy_rs: its simulation-mode UDP ports (mujoco_simulation_G23.py defaults)
    cmd_port: 20001           # torque commands from the controller (240 bytes: kp | q | kd | dq | tau x 12)
    telemetry: [127.0.0.1:30010, 127.0.0.1:30011]   # 1 kHz state packets: controller, web GUI
    command_addr: 127.0.0.1:50051                   # text commands (MODE STAND / MODE RL / AXES vx vy wz)
    gt_addr: null             # SIM_POSE ground-truth lines: null = G2_SIM_GT_IP/PORT (127.0.0.1:30012, as their sim), "" = off
    ros_bridge_addr: null     # their ASCII state line for udp_ros_bridge: null = G2_SIM_ROS_BRIDGE_IP/PORT (127.0.0.1:50010)
    ros_ascii_telemetry: null # null = G2_SIM_ROS_ASCII_TELEMETRY (on, as their sim); true / false overrides
  # ideal base (and the terrain probe / free-pose search used by both types)
  body_size: [0.70, 0.31, 0.16]   # collision box full extents (x, y, z)
  mass: 15.0
  stand_height: 0.30          # feet plane -> body centre, measured along the plane normal (body bottom stays parallel to the feet plane on stairs)
  foot_offsets: [[0.19, 0.13], [0.19, -0.13], [-0.19, 0.13], [-0.19, -0.13]]
  foot_patch: 0.08            # spacing of the 3x3 ray patch under each foot
  attitude_tau: 0.05          # low-pass of height/roll/pitch (s). 0.15 lagged the pitch ~13 deg at 0.5 m/s on stairs and the body touched the risers; flattened / 1:1 floors are not noisy
  max_step_up: 0.22           # largest per-foot height change accepted per control tick (stairs rise 0.17-0.20: 0.18 left no margin)
  max_step_down: 0.25
  max_feet_over_gap: 1        # feet allowed over a gap in the floor (height taken from the other feet's plane)
  max_slope_deg: 50.0         # plane through the 4 feet: 31-42 deg on real flights, 46 deg on hand-drawn 0.2 m deep treads (0.2 m octree); 30 refused every staircase
  vel_limits: [1.5, 0.8, 2.0]     # |vx|, |vy|, |wz|
  acc_limits: [2.0, 2.0, 4.0]
  cmd_tau: 0.15               # first-order lag of the gait controller (s)
  cmd_timeout: 0.5            # zero the command if no /cmd_vel for this long (s)
  weld_solref: [0.02, 1.0]    # softness of the base <- target weld
  collision_margin: 0.6       # proxy window beyond the body footprint (m)
  collision_pool: 256         # number of mocap proxy boxes (g23: the window holds ~110 contact boxes at 0.6 m on a 0.1 m scene)

lidar:                        # Livox Mid-360-like, rolling (per-point time)
  mount_xyz: [0.195, 0.0, 0.155]  # in base_link: the robot URDF's base_link -> lidar_top joint (syncai_bringup G23.urdf)
  mount_rpy: [0.0, 0.25, 0.0]     # rad, URDF rpy: the Mid-360 is pitched 0.25 rad on the mount; the cloud stays in the sensor frame, TF carries the tilt
  rate_hz: 10
  points_per_sec: 200000
  fov_deg: [-7.0, 52.0]
  lines: 4
  min_range: 0.1
  max_range: 40.0
  range_noise: 0.02           # sigma (m)
  dropout: 0.0                # random drop probability
  grazing_cos: 0.08           # drop returns with |cos(incidence)| below this
  seed: 0

imu:                          # co-located with the LiDAR (Mid-360 internal IMU)
  rate_hz: 200
  acc_noise: 0.02             # m/s^2 white noise sigma
  gyro_noise: 0.002           # rad/s
  acc_bias_rw: 0.0005         # m/s^2/sqrt(s)
  gyro_bias_rw: 0.00005       # rad/s/sqrt(s)

viewer:                       # MuJoCo viewer (--viewer) only; the map mesh has millions of triangles
  shadows: false              # the map casting shadows on itself doubles the render cost for little gain
  sync_hz: 30                 # max rate (wall clock) at which the sim pushes its state to the viewer window
  max_map_boxes: 400000       # boxes drawn in the viewer mesh, nearest to the spawn first (0.1-0.2 m scenes have fewer; a 0.03 m scene has ~3.4 M, 12 triangles each: 1500000 shows ~the whole storey)

web:                          # browser viewer (viser), on by default: http://<host>:8755 (quadsim/web_viewer.py)
  enabled: true               # --no-web or web.enabled=false turns it off; a missing viser only logs a warning
  port: 8755                  # the container runs with --net=host, so this is the host's port (busy = next free one, logged)
  hz: 30                      # max rate (wall clock) of robot pose updates to the browsers; nothing is sent without a client
  lidar_hz: 10                # max rate of LiDAR cloud updates
  lidar_points: 8000          # points per displayed LiDAR frame (uniformly decimated from ~20 k)
  map: points                 # points: map_ds.pcd coloured by height | boxes: one cube per scene box, coloured by height with a checkerboard shade (edges visible, instanced) | none
  max_map_points: 1500000     # voxel-downsample the map cloud beyond this (dp_1008 has 1.7 M, a 0.03 m scene 17 M)
  max_map_boxes: 400000       # map: boxes only, nearest the spawn first (as viewer.max_map_boxes)
  map_precision: float32      # float16 halves the map download but quantises to ~3 cm at 50 m from the origin
  path_topic: /robot01/planned_path   # nav_msgs/Path from the planner, drawn as a line ("" = off)

ros:
  frames: {map: map, odom: robot01/odom, base: robot01/base_link, lidar: robot01/laser}
  publish_gt_tf: false        # map->odom (identity) + odom->base_link ground truth; false = leave to Point-LIO/localization
  publish_custom_msg: true    # /livox/lidar as livox_ros_driver2/CustomMsg (if the msg package is installed)
  publish_pointcloud2: false
  pointcloud2_format: livox   # livox: x y z intensity tag line timestamp | velodyne: x y z intensity ring time
  publish_map_cloud: true
  clock_hz: 200
  odom_hz: 50
  topics:
    clock: /clock
    lidar_custom: /robot01/livox/lidar
    lidar_points: /robot01/livox/points
    imu: /robot01/livox/imu
    gt_odom: /sim/ground_truth/odom
    events: /sim/events
    map_cloud: /sim/map_cloud
    cmd_vel: /robot01/cmd_vel
    set_pose: /robot01/set_pose
    policy_mode: /robot01/policy_mode   # std_msgs/Int32 (g23): 0 PPO / rl_fcn, 1 HIMLoco / rl_him (g2_deploy_rs also 4 IsaacSim)
