# robot_localization against the sim's GNSS (launch/gnss_ekf.launch.py; docs/usage.md 3.4): a map-frame EKF that
# fuses the nav stack's odometry with the fix turned into map coordinates by navsat_transform_node. It publishes
# no TF (the nav stack owns map -> odom); /odometry/filtered is compared with /sim/ground_truth/odom and the nav's
# /robot01/tracked_pose by scripts/gnss_ekf_check.py.
navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 10.0               # the sim's gnss.rate_hz
    delay: 1.0
    magnetic_declination_radians: 0.0
    # heading = odometry yaw + yaw_offset: the map x axis is 31.0 deg counter-clockwise from east (config/sim.yaml
    # gnss.datum.yaw_deg), so a robot at map yaw 0 heads 31 deg in ENU. The datum is the first fix at the odometry
    # pose of that moment, so the test does not depend on where the robot spawned.
    yaw_offset: 0.5410521
    use_odometry_yaw: true        # the sim IMU carries no orientation; no imu topic is subscribed
    # UTM, not use_local_cartesian: the humble package aborts in local-cartesian mode ("MGRS string too short",
    # GeographicLib::GeographicErr, 2026-11-05); the output is relative to the datum either way
    use_local_cartesian: false
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: true    # /gnss/filtered: the EKF pose back as lat / lon, to eyeball against the sim fix
    wait_for_datum: false

ekf_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: false             # compare only: map -> odom stays with transform_fusion
    map_frame: map
    odom_frame: robot01/odom
    base_link_frame: robot01/base_link
    world_frame: map
    # the nav stack's odometry (Point-LIO through transform_fusion, odom -> base_link): yaw as the heading, body
    # velocities for the motion model. odom's yaw is taken as absolute because map -> odom is seeded as identity at
    # the spawn; this is a test of the GNSS path, not a production fusion.
    odom0: /robot01/odom
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    # the fix in map coordinates: x, y only
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
