# robot_localization against the sim's GNSS (launch/gnss_ekf.launch.py; docs/usage.md 3.4): a map-frame EKF that
# fuses the nav stack's odometry with the fix turned into map coordinates through the map datum. It publishes
# no TF (the nav stack owns map -> odom); /odometry/filtered is compared with /sim/ground_truth/odom and the nav's
# /robot01/tracked_pose by scripts/gnss_ekf_check.py.
# The fix enters as /odometry/gps from scripts/gnss_map_odom.py (fixed map datum). robot_localization's
# navsat_transform_node was tried first (2026-11-05): its datum is anchored to the robot's pose at start-up, so
# the first fix's noise became a permanent 2-3 m offset, and the humble build aborts in use_local_cartesian mode
# ("MGRS string too short").
ekf_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: false             # compare only: map -> odom stays with transform_fusion
    map_frame: map
    odom_frame: robot01/odom
    base_link_frame: robot01/base_link
    world_frame: map
    # the nav stack's odometry (Point-LIO through transform_fusion, odom -> base_link): yaw as the heading, body
    # velocities for the motion model. odom's yaw is taken as absolute because map -> odom is seeded as identity at
    # the spawn; this is a test of the GNSS path, not a production fusion.
    odom0: /robot01/odom
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    # the fix in map coordinates: x, y only
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
